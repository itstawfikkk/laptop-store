<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الآدمي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- شاشة تسجيل الدخول (تظهر تلقائياً إذا لم تكن مسجلاً) -->
    <div id="login-section" class="min-h-screen flex items-center justify-center px-4">
        <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md">
            <h2 class="text-2xl font-bold text-center mb-6 text-gray-800">تسجيل دخول الآدمي</h2>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-1">البريد الإلكتروني</label>
                    <input type="email" id="email" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">كلمة المرور</label>
                    <input type="password" id="password" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition">دخول</button>
                <p id="login-error" class="text-red-500 text-sm text-center mt-2"></p>
            </form>
            <div class="text-center mt-4">
                <a href="index.html" class="text-sm text-gray-500 hover:underline">العودة للرئيسية</a>
            </div>
        </div>
    </div>

    <!-- لوحة التحكم (مخفية لحين تسجيل الدخول بنجاح) -->
    <div id="admin-dashboard" class="hidden min-h-screen py-10 px-4">
        <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-md p-8">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <h2 class="text-xl font-bold text-blue-600"><i class="fa-solid fa-plus-circle ml-2"></i> إضافة لابتوب جديد</h2>
                <div class="flex gap-3">
                    <a href="index.html" class="text-gray-600 bg-gray-100 px-3 py-1.5 rounded-lg text-sm">عرض الموقع</a>
                    <button id="logout-btn" class="text-red-600 bg-red-50 px-3 py-1.5 rounded-lg text-sm hover:bg-red-100">تسجيل خروج</button>
                </div>
            </div>

            <form id="add-laptop-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-1">اسم الموديل / الجهاز</label>
                    <input type="text" id="laptop-name" placeholder="مثال: Dell Latitude 5420 i7" required class="w-full px-4 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1">السعر (بالدينار الأردني)</label>
                        <input type="number" id="laptop-price" placeholder="350" required class="w-full px-4 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">رابط صورة الجهاز (Image URL)</label>
                        <input type="url" id="laptop-image" placeholder="ضع رابط الصورة هنا" required class="w-full px-4 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">المواصفات التفصيلية</label>
                    <textarea id="laptop-specs" rows="4" placeholder="Core i7 11th Gen - RAM 16GB - SSD 512GB - Screen 14 inch" required class="w-full px-4 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>

                <button type="submit" id="save-btn" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700 transition flex items-center justify-center gap-2">
                    حفظ ونشر الجهاز
                </button>
                <p id="status-msg" class="text-center text-sm mt-2"></p>
            </form>
        </div>
    </div>

    <!-- كود جافاسكريبت لوحة التحكم -->
    <script type="module" src="js/admin.js"></script>
</body>
</html>
